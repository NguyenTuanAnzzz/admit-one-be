spring.application.name=admit-one

spring.datasource.url=jdbc:postgresql://localhost:5432/admit_one
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Gộp INSERT theo lô 500 dòng: lưu 20.000 ghế thành khoảng 40 lần gửi xuống DB thay vì 20.000
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


jwt.secret=${JWT_SECRET}
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

app.base-url=http://localhost:8080

cloudinary.url=${CLOUDINARY_URL}

# Upload ảnh tối đa 10MB (giới hạn của Cloudinary gói miễn phí), vượt quá thì Spring ném MaxUploadSizeExceededException
spring.servlet.multipart.max-file-size=10MB
# Request lớn hơn file một chút vì có thêm phần đầu multipart
spring.servlet.multipart.max-request-size=11MB
# Mặc định Tomcat chỉ đọc bỏ tối đa 2MB của request quá lớn rồi cắt kết nối (trình duyệt báo ERR_CONNECTION_RESET).
# -1: đọc hết rồi mới trả lỗi, để handler MaxUploadSizeExceededException trả được 413 "Ảnh tối đa 10MB"
server.tomcat.max-swallow-size=-1

# payOS: 3 khoá lấy ở my.payos.vn → Kênh thanh toán. Giá trị thật đặt trong biến môi trường, không ghi thẳng vào file này
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
# Checksum key dùng để ký link thanh toán và kiểm tra chữ ký webhook
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
# Thanh toán xong (hoặc huỷ) payOS đưa khách về trang chi tiết đơn của FE
app.fe-url=http://localhost:5173
